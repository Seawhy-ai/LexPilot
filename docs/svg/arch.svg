<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <!-- 箭头定义 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
  </defs>

  <!-- 白色背景 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 第1层：入口层 (主蓝) -->
  <g id="layer1">
    <rect x="40" y="35" width="840" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <!-- 左侧竖色条 -->
    <rect x="42" y="37" width="6" height="96" fill="#2563eb" rx="3" />
    <!-- 层名 + 说明 -->
    <text x="460" y="65" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">入口层</text>
    <text x="460" y="90" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">分享链接 · 网页嵌入 · 公众号菜单</text>
    <text x="460" y="110" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">(浏览器直开，零安装)</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="460" y1="135" x2="460" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" opacity="0.8" />

  <!-- 第2层：平台层 (主蓝) -->
  <g id="layer2">
    <rect x="40" y="165" width="840" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <!-- 左侧竖色条 -->
    <rect x="42" y="167" width="6" height="96" fill="#2563eb" rx="3" />
    <!-- 层名 + 说明 -->
    <text x="460" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">平台层</text>
    <text x="460" y="220" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">FastGPT(开源)：对话界面</text>
    <text x="460" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">工作流引擎 · 变量记忆</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="460" y1="265" x2="460" y2="290" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" opacity="0.8" />

  <!-- 第3层：能力层 (主绿) -->
  <g id="layer3">
    <rect x="40" y="295" width="840" height="100" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
    <!-- 左侧竖色条 -->
    <rect x="42" y="297" width="6" height="96" fill="#16a34a" rx="3" />
    <!-- 层名 + 说明 -->
    <text x="460" y="325" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">能力层</text>
    <text x="460" y="350" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">领域识别 → 要素引导 → 知识库检索</text>
    <text x="460" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">→ AI 生成 → 分支指引</text>
  </g>

  <!-- 箭头 3 -->
  <line x1="460" y1="395" x2="460" y2="420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" opacity="0.8" />

  <!-- 第4层：数据层 (主橙) -->
  <g id="layer4">
    <rect x="40" y="425" width="840" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
    <!-- 左侧竖色条 -->
    <rect x="42" y="427" width="6" height="96" fill="#d97706" rx="3" />
    <!-- 层名 + 说明 -->
    <text x="460" y="455" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#d97706">数据层</text>
    <text x="460" y="480" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">法条库 · 案例库 · FAQ 库</text>
    <text x="460" y="500" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#374151">渠道库 · 模板库</text>
  </g>
</svg>