name: Build iOS .ipa

# 手动触发：仓库 → Actions → Build iOS .ipa → Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag to build (default: master)'
        required: false
        default: 'master'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor deps
        working-directory: ios
        run: npm install

      - name: Sync web assets into iOS project
        working-directory: ios
        run: npx cap sync ios

      - name: Build unsigned .app (Release, no code signing)
        working-directory: ios
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          test -d "$APP" || { echo "App.app not found at $APP"; find build/Build/Products -maxdepth 2 -type d | head -20; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # 关键：删除签名相关残留，避免重签名时报错
          rm -rf Payload/App.app/_CodeSignature
          rm -f Payload/App.app/embedded.mobileprovision
          zip -r -y SeaWhyLex-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaWhyLex-unsigned-ipa
          path: ios/SeaWhyLex-unsigned.ipa
          if-no-files-found: error
