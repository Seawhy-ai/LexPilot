plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seawhy.lex'
    compileSdk 34

    defaultConfig {
        applicationId "com.seawhy.lex"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "2.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
